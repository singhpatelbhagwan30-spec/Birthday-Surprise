<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Meri Pyaari Jaan 🤍</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    background: linear-gradient(135deg,
        #bde7ff, #ffffff, #d5efff, #a9dcf8);
    font-family: Georgia, serif;
    overflow-x: hidden;
}

.card {
    width: 100%;
    max-width: 450px;
    padding: 35px 25px;
    background: rgba(255,255,255,0.78);
    border: 2px solid white;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(75,160,210,0.2);
    position: relative;
    z-index: 2;
    animation: appear 1.5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(35px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.butterfly {
    font-size: 38px;
    margin-bottom: 15px;
}

h1 {
    color: #3989b9;
    font-size: 27px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.line {
    width: 75px;
    height: 3px;
    background: #9bd8f5;
    margin: 0 auto 25px;
    border-radius: 10px;
}

.message {
    color: #557d98;
    font-size: 18px;
    line-height: 2;
}

.footer {
    font-size: 30px;
    margin-top: 25px;
}

.music-btn {
    margin-top: 25px;
    padding: 12px 22px;
    background: #80c8ed;
    border: none;
    border-radius: 30px;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.heart {
    position: fixed;
    bottom: -30px;
    color: white;
    font-size: 25px;
    pointer-events: none;
    animation: float 8s linear forwards;
}

@keyframes float {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="butterfly">🦋 🤍 🦋</div>

    <h1>
        🎉 Happy Birthday<br>
        Meri Pyaari Jaan 🫂🥰💙
    </h1>

    <div class="line"></div>

    <div class="message">

        Thank you so much for being in my life
        and making it so special 🥰

        <br><br>

        I thank Satguru, who sent you in my life. ❤️

        <br><br>

        Satguru ji Bless you aur apna din enjoy karna!!

        <br><br>

        Khush rahna and Love you so much
        meri Jaan 🤍🥰

    </div>

    <div class="footer">
        🤍 🦋 🤍
    </div>

    <button class="music-btn" onclick="toggleMusic()">
        🎹 Play Birthday Music
    </button>

</div>

<audio id="music" src="music.mp3" loop></audio>

<script>

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = Math.random() > 0.5 ? "🤍" : "♡";

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 10000);

}

setInterval(createHeart, 600);

async function toggleMusic() {

    const music = document.getElementById("music");
    const button = document.querySelector(".music-btn");

    if (music.paused) {
        try {
            await music.play();
            button.innerHTML = "⏸ Pause Music";
        } catch (error) {
            alert("Please upload music.mp3 to your repository first!");
        }
    } else {
        music.pause();
        button.innerHTML = "🎹 Play Birthday Music";
    }

}

</script>

</body>
</html>
